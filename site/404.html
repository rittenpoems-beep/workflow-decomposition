<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在｜Workflow Decomposition</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F1E7">
<link rel="icon" href="/workflow-decomposition/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/workflow-decomposition/assets/css/site.css">
<style>
  .notfound { min-height: 100vh; display: grid; place-items: center; padding: 48px 0; }
  .notfound-inner { max-width: 680px; }
  .notfound-code { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; color: var(--red); }
  .notfound h1 { margin: 16px 0 20px; font-family: var(--serif); font-size: clamp(32px, 6vw, 72px); line-height: 1.15; }
  .notfound p { margin: 0 0 14px; color: var(--muted); line-height: 1.9; }
  .notfound .btn { margin-top: 22px; }
  .notfound-rule { margin: 34px 0 0; padding-top: 18px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: .06em; }
</style>
</head>
<body>
<main class="notfound">
  <div class="shell">
    <div class="notfound-inner">
      <p class="notfound-code">ERROR 404 / PAGE NOT FOUND</p>
      <h1>这一页<br>没有被拆解出来。</h1>
      <p>你访问的地址不存在，或者它已经被移动到别处。</p>

      <a class="btn primary" href="/workflow-decomposition/">返回拆解册</a>

    </div>
  </div>
